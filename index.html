<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>jour j</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f7f5f0;
    color:#222;
    font-family:
        Arial,
        Tahoma,
        sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

img{
    display:block;
}

.page{
    display:none;
}

.page.active{
    display:block;
}


/* =====================================================
   SPLASH SCREEN
===================================================== */

#splash{

    position:fixed;

    inset:0;

    width:100%;
    height:100vh;

    z-index:9999;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:
    linear-gradient(
        180deg,
        #fffdf9,
        #f5efe4
    );

    transition:
    opacity .5s ease;

}

.splash-logo{

    width:82%;

    max-width:430px;

    max-height:54vh;

    object-fit:contain;

    animation:
    logoIn 1.2s ease;

}

.splash-name{

    margin-top:0;

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:42px;

    letter-spacing:5px;

    color:#171717;

    font-weight:600;

    animation:
    textIn 1.5s ease;

}

.gold-line{

    width:80px;

    height:2px;

    background:#c89b3c;

    margin-top:10px;

}

.splash-description{

    margin-top:11px;

    font-size:11px;

    letter-spacing:2px;

    color:#90733b;

    text-transform:uppercase;

}

.enter-btn{

    margin-top:32px;

    width:180px;

    height:52px;

    border:none;

    border-radius:30px;

    color:white;

    font-size:17px;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        #b98b2f,
        #dfbd69
    );

    box-shadow:
    0 9px 25px
    rgba(180,135,40,.25);

    transition:.25s;

}

.enter-btn:hover{
    transform:translateY(-3px);
}

.enter-btn:active{
    transform:scale(.96);
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:64px;

    background:#171717;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;

    position:sticky;

    top:0;

    z-index:100;

}

.logo-small{

    display:flex;

    align-items:center;

    gap:9px;

    font-family:
    Georgia,
    serif;

    font-size:21px;

    letter-spacing:3px;

}

.logo-icon{

    width:36px;
    height:36px;

    border-radius:11px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#d3ad58;

    color:#111;

    font-weight:bold;

}

.back-btn{

    display:none;

    border:none;

    background:#2b2b2b;

    color:white;

    padding:9px 14px;

    border-radius:10px;

}


/* =====================================================
   GENERAL CONTAINER
===================================================== */

.container{

    width:94%;

    max-width:1050px;

    margin:auto;

}


/* =====================================================
   HOME TITLE
===================================================== */

.home-header{

    text-align:center;

    padding-top:28px;

}

.home-header h1{

    font-family:
    Georgia,
    serif;

    font-size:27px;

}

.home-header p{

    color:#888;

    font-size:14px;

    margin-top:8px;

}


/* =====================================================
   CATEGORY CARDS
===================================================== */

.categories{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:14px;

    margin-top:25px;

    padding-bottom:40px;

}

.category-card{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.07);

    cursor:pointer;

    transition:.25s;

}

.category-card:hover{

    transform:
    translateY(-4px);

}

.category-card:active{

    transform:
    scale(.98);

}

.category-image{

    width:100%;

    height:145px;

    object-fit:cover;

}

.category-content{

    padding:12px;

}

.category-content h2{

    font-size:16px;

    margin-bottom:6px;

}

.rating{

    color:#d1a642;

    letter-spacing:1px;

    font-size:14px;

}

.rating-score{

    color:#888;

    font-size:12px;

    margin-right:5px;

}


/* =====================================================
   TOP CATEGORIES ON DETAILS
===================================================== */

.top-categories{

    background:white;

    border-bottom:
    1px solid #eee;

    position:sticky;

    top:64px;

    z-index:50;

    padding:10px 0;

}

.category-scroll{

    display:flex;

    align-items:flex-start;

    gap:15px;

    overflow-x:auto;

    padding:
    0 10px 4px;

    scrollbar-width:none;

}

.category-scroll::-webkit-scrollbar{
    display:none;
}

.mini-category{

    min-width:68px;

    text-align:center;

    cursor:pointer;

}

.mini-image{

    width:57px;

    height:57px;

    border-radius:50%;

    object-fit:cover;

    padding:2px;

    border:
    2px solid transparent;

    transition:.25s;

}

.mini-category.active .mini-image{

    border-color:#c99e3f;

    box-shadow:
    0 0 0 3px
    rgba(201,158,63,.15);

}

.mini-name{

    margin-top:5px;

    font-size:10px;

    color:#666;

    white-space:nowrap;

}

.mini-category.active .mini-name{

    color:#a47a24;

    font-weight:bold;

}


/* =====================================================
   DETAILS
===================================================== */

.details-container{

    padding-bottom:50px;

}


/* =====================================================
   HERO
===================================================== */

.hero{

    height:235px;

    margin-top:18px;

    border-radius:20px;

    overflow:hidden;

    position:relative;

}

.hero img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.hero-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:flex-end;

    padding:20px;

    color:white;

    background:
    linear-gradient(
        transparent 30%,
        rgba(0,0,0,.82)
    );

}

.hero-title{

    font-size:27px;

    font-weight:bold;

}

.hero-rating{

    margin-top:6px;

}

.hero-rating .rating-score{

    color:#ddd;

}


/* =====================================================
   INFO CARDS
===================================================== */

.info-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-top:15px;

}

.info-card{

    background:white;

    min-height:105px;

    padding:14px;

    border-radius:15px;

    box-shadow:
    0 4px 15px
    rgba(0,0,0,.04);

}

.info-icon{

    font-size:21px;

    margin-bottom:8px;

}

.info-card h3{

    font-size:14px;

    margin-bottom:5px;

}

.info-card p{

    color:#777;

    font-size:12px;

    line-height:1.6;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

    margin-top:27px;

    margin-bottom:12px;

    font-size:19px;

    font-family:
    Georgia,
    serif;

}


/* =====================================================
   PORTFOLIO
===================================================== */

.portfolio{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:7px;

}

.portfolio img{

    width:100%;

    height:105px;

    object-fit:cover;

    border-radius:12px;

    cursor:pointer;

    transition:.25s;

}

.portfolio img:hover{

    transform:
    scale(.98);

}

.portfolio img:first-child{

    grid-column:
    span 2;

    height:145px;

}


/* =====================================================
   PRICE
===================================================== */

.price-card{

    background:#171717;

    color:white;

    padding:19px;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
    0 7px 20px
    rgba(0,0,0,.12);

}

.price-label{

    color:#aaa;

    font-size:12px;

}

.price{

    color:#d7b45c;

    font-size:22px;

    font-weight:bold;

    margin-top:5px;

}

.price-icon{

    width:44px;
    height:44px;

    border-radius:50%;

    background:#292929;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =====================================================
   DAYS
===================================================== */

.days-card{

    background:white;

    border-radius:16px;

    padding:15px;

}

.days{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

}

.day{

    padding:
    9px 13px;

    border-radius:20px;

    background:#eeeeee;

    color:#888;

    font-size:12px;

}

.day.available{

    background:#f1e3bd;

    color:#89691e;

    font-weight:bold;

}


/* =====================================================
   LOCATION
===================================================== */

.location-card{

    background:white;

    padding:15px;

    border-radius:17px;

}

.location-address{

    font-size:13px;

    color:#666;

}

.fake-map{

    height:180px;

    margin-top:12px;

    border-radius:14px;

    overflow:hidden;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #dce8d9,
        #b9d0b7
    );

}

.fake-map:before{

    content:"";

    position:absolute;

    width:150%;

    height:3px;

    background:white;

    transform:
    rotate(25deg);

    box-shadow:
    0 45px white,
    0 90px white,
    0 135px white;

}

.map-pin{

    position:relative;

    z-index:2;

    width:52px;

    height:52px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#d4ad54;

    font-size:22px;

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.2);

}


/* =====================================================
   CONTACT
===================================================== */

.contact-card{

    background:white;

    border-radius:17px;

    padding:18px;

    margin-top:16px;

}

.contact-card h2{

    font-size:18px;

}

.contact-info{

    color:#777;

    font-size:13px;

    line-height:1.9;

    margin-top:7px;

}

.contact-buttons{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:8px;

    margin-top:14px;

}

.contact-btn{

    border:none;

    padding:12px;

    border-radius:11px;

    font-weight:bold;

}

.call-btn{

    background:#171717;

    color:white;

}

.email-btn{

    background:#eee;

    color:#333;

}


/* =====================================================
   LIGHTBOX
===================================================== */

#lightbox{

    display:none;

    position:fixed;

    inset:0;

    z-index:9999;

    background:
    rgba(0,0,0,.93);

    align-items:center;

    justify-content:center;

}

#lightbox img{

    max-width:92%;

    max-height:85%;

    border-radius:14px;

}

.close-lightbox{

    position:absolute;

    top:15px;

    right:20px;

    color:white;

    font-size:38px;

    cursor:pointer;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    padding:30px 10px;

    color:#999;

    font-size:12px;

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .categories{

        grid-template-columns:
        repeat(3,1fr);

    }

    .category-image{

        height:175px;

    }

    .info-grid{

        grid-template-columns:
        repeat(4,1fr);

    }

    .portfolio{

        grid-template-columns:
        repeat(5,1fr);

    }

    .portfolio img{

        height:145px;

    }

    .portfolio img:first-child{

        grid-column:auto;

        height:145px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:450px){

    .splash-logo{

        width:92%;

        max-height:52vh;

    }

    .splash-name{

        font-size:37px;

    }

    .hero{

        height:220px;

    }

    .hero-title{

        font-size:24px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SPLASH
===================================================== -->

<div id="splash">


    <img
        src="jour-j-logo.png"
        class="splash-logo"
        alt="jour j"
    >


    <div class="splash-name">
        jour j
    </div>


    <div class="gold-line"></div>


    <div class="splash-description">
        Le moment qu'on attend
    </div>


    <button
        class="enter-btn"
        onclick="enterApp()"
    >
        Entrée
    </button>


</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


    <div class="logo-small">

        <div class="logo-icon">
            J
        </div>

        jour j

    </div>


    <button
        id="backButton"
        class="back-btn"
        onclick="showHome()"
    >
        ← رجوع
    </button>


</header>


<!-- =====================================================
     HOME
===================================================== -->

<section
    id="homePage"
    class="page"
>

    <div class="container">


        <div class="home-header">

            <h1>
                اكتشف الأقسام
            </h1>

            <p>
                اختر المكان المناسب ليومك المميز
            </p>

        </div>


        <div
            id="categories"
            class="categories"
        ></div>


        <div class="footer">

            jour j © 2026

        </div>


    </div>

</section>


<!-- =====================================================
     DETAILS
===================================================== -->

<section
    id="detailsPage"
    class="page"
>


    <!-- الأقسام الأخرى -->

    <div class="top-categories">

        <div
            id="miniCategories"
            class="category-scroll"
        ></div>

    </div>


    <div
        id="detailsContent"
        class="container details-container"
    ></div>


</section>


<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    id="lightbox"
    onclick="closeLightbox()"
>

    <div
        class="close-lightbox"
    >
        ×
    </div>

    <img
        id="lightboxImage"
        src=""
        alt=""
    >

</div>


<script>


/* =====================================================
   DATA
===================================================== */

const places = [

    {

        id:"wedding",

        name:"قاعة الأعراس",

        title:"قاعة اللؤلؤة",

        rating:"★★★★★",

        score:"4.9",

        mainImage:
        "https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1400&q=85",

        phone:
        "+213 550 00 00 00",

        email:
        "contact@perle.dz",

        address:
        "وهران، الجزائر",

        price:
        "120,000 دج",

        location:
        "وهران، الجزائر",

        days:[
            "السبت",
            "الخميس",
            "الجمعة"
        ],

        portfolio:[

            "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1478146896981-b80fe463b330?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1200&q=85"

        ]

    },


    {

        id:"sport",

        name:"قاعة الرياضة",

        title:"Fitness Arena",

        rating:"★★★★☆",

        score:"4.7",

        mainImage:
        "https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=1400&q=85",

        phone:
        "+213 560 11 22 33",

        email:
        "contact@fitnessarena.dz",

        address:
        "وهران، الجزائر",

        price:
        "2,500 دج / شهر",

        location:
        "وهران، الجزائر",

        days:[
            "السبت",
            "الأحد",
            "الإثنين",
            "الثلاثاء",
            "الأربعاء",
            "الخميس"
        ],

        portfolio:[

            "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=1200&q=85",

            "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85"

        ]

    }

];


/* =====================================================
   ENTER APP
===================================================== */

function enterApp(){

    const splash =
    document.getElementById("splash");

    splash.style.opacity="0";

    setTimeout(()=>{

        splash.style.display="none";

        showHome();

    },500);

}


/* =====================================================
   SHOW HOME
===================================================== */

function showHome(){

    document
    .getElementById("homePage")
    .classList.add("active");

    document
    .getElementById("detailsPage")
    .classList.remove("active");

    document
    .getElementById("backButton")
    .style.display="none";

    window.scrollTo(0,0);

    renderCategories();

}


/* =====================================================
   HOME CATEGORIES
===================================================== */

function renderCategories(){

    const container =
    document.getElementById("categories");

    container.innerHTML="";


    places.forEach(place=>{

        container.innerHTML += `

            <div
                class="category-card"
                onclick="openPlace('${place.id}')"
            >

                <img
                    class="category-image"
                    src="${place.mainImage}"
                    alt="${place.name}"
                >

                <div class="category-content">

                    <h2>
                        ${place.name}
                    </h2>

                    <div class="rating">

                        ${place.rating}

                        <span
                            class="rating-score"
                        >
                            ${place.score}
                        </span>

                    </div>

                </div>

            </div>

        `;

    });

}


/* =====================================================
   OPEN PLACE
===================================================== */

function openPlace(id){

    const place =
    places.find(
        item => item.id === id
    );

    if(!place) return;


    document
    .getElementById("homePage")
    .classList.remove("active");

    document
    .getElementById("detailsPage")
    .classList.add("active");


    document
    .getElementById("backButton")
    .style.display="block";


    renderMiniCategories(id);

    renderDetails(place);

    window.scrollTo(0,0);

}


/* =====================================================
   MINI CATEGORIES
===================================================== */

function renderMiniCategories(activeId){

    const container =
    document.getElementById(
        "miniCategories"
    );

    container.innerHTML="";


    places.forEach(place=>{

        const active =
        place.id === activeId;


        container.innerHTML += `

            <div
                class="
                    mini-category
                    ${active ? "active" : ""}
                "
                onclick="
                    openPlace('${place.id}')
                "
            >

                <img
                    class="mini-image"
                    src="${place.mainImage}"
                    alt="${place.name}"
                >

                <div class="mini-name">

                    ${place.name}

                </div>

            </div>

        `;

    });

}


/* =====================================================
   RENDER DETAILS
===================================================== */

function renderDetails(place){

    const content =
    document.getElementById(
        "detailsContent"
    );


    let portfolioHTML="";


    place.portfolio.forEach(
        (image,index)=>{

            portfolioHTML += `

                <img
                    src="${image}"
                    alt="Portfolio"
                    onclick="
                        openLightbox('${image}')
                    "
                >

            `;

        }
    );


    const allDays=[

        "السبت",
        "الأحد",
        "الإثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة"

    ];


    let daysHTML="";


    allDays.forEach(day=>{

        const available =
        place.days.includes(day);


        daysHTML += `

            <div
                class="
                    day
                    ${available ? "available" : ""}
                "
            >

                ${day}

                ${available ? " ✓" : ""}

            </div>

        `;

    });


    content.innerHTML = `

        <!-- HERO -->

        <div class="hero">

            <img
                src="${place.mainImage}"
                alt="${place.title}"
            >

            <div class="hero-overlay">

                <div>

                    <div class="hero-title">
                        ${place.title}
                    </div>

                    <div class="hero-rating">

                        <span class="rating">
                            ${place.rating}
                        </span>

                        <span class="rating-score">
                            ${place.score} / 5
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- INFORMATION -->

        <div class="info-grid">


            <div class="info-card">

                <div class="info-icon">
                    📍
                </div>

                <h3>
                    العنوان
                </h3>

                <p>
                    ${place.address}
                </p>

            </div>


            <div class="info-card">

                <div class="info-icon">
                    📞
                </div>

                <h3>
                    الهاتف
                </h3>

                <p>
                    ${place.phone}
                </p>

            </div>


            <div class="info-card">

                <div class="info-icon">
                    ✉️
                </div>

                <h3>
                    البريد الإلكتروني
                </h3>

                <p>
                    ${place.email}
                </p>

            </div>


            <div class="info-card">

                <div class="info-icon">
                    ⭐
                </div>

                <h3>
                    التقييم
                </h3>

                <p>
                    ${place.score} / 5
                </p>

            </div>


        </div>


        <!-- PORTFOLIO -->

        <h2 class="section-title">
            📸 معرض الصور
        </h2>

        <div class="portfolio">

            ${portfolioHTML}

        </div>


        <!-- PRICE -->

        <h2 class="section-title">
            💰 السعر
        </h2>

        <div class="price-card">

            <div>

                <div class="price-label">
                    السعر يبدأ من
                </div>

                <div class="price">
                    ${place.price}
                </div>

            </div>

            <div class="price-icon">
                💳
            </div>

        </div>


        <!-- AVAILABLE DAYS -->

        <h2 class="section-title">
            📅 الأيام المتاحة
        </h2>

        <div class="days-card">

            <div class="days">

                ${daysHTML}

            </div>

        </div>


        <!-- LOCATION -->

        <h2 class="section-title">
            📍 الموقع
        </h2>

        <div class="location-card">

            <div class="location-address">

                ${place.location}

            </div>


            <div class="fake-map">

                <div class="map-pin">
                    📍
                </div>

            </div>

        </div>


        <!-- CONTACT -->

        <div class="contact-card">

            <h2>
                تواصل مع صاحب القسم
            </h2>


            <div class="contact-info">

                📞 ${place.phone}

                <br>

                ✉️ ${place.email}

            </div>


            <div class="contact-buttons">


                <button
                    class="
                        contact-btn
                        call-btn
                    "
                    onclick="
                        callPlace('${place.phone}')
                    "
                >

                    📞 اتصال

                </button>


                <button
                    class="
                        contact-btn
                        email-btn
                    "
                    onclick="
                        emailPlace('${place.email}')
                    "
                >

                    ✉️ البريد

                </button>


            </div>

        </div>


        <div class="footer">

            jour j © 2026

        </div>

    `;

}


/* =====================================================
   PHONE
===================================================== */

function callPlace(phone){

    window.location.href =
    "tel:" + phone;

}


/* =====================================================
   EMAIL
===================================================== */

function emailPlace(email){

    window.location.href =
    "mailto:" + email;

}


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(image){

    const lightbox =
    document.getElementById(
        "lightbox"
    );

    const imageElement =
    document.getElementById(
        "lightboxImage"
    );

    imageElement.src=image;

    lightbox.style.display="flex";

}


function closeLightbox(){

    document
    .getElementById("lightbox")
    .style.display="none";

}


/* =====================================================
   INITIAL
===================================================== */

renderCategories();

</script>

</body>

</html>
