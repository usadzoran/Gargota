<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RÉSERVA</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        Arial,
        Tahoma,
        sans-serif;
}

body{
    background:#f7f7f7;
    color:#222;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.page{
    display:none;
}

.page.active{
    display:block;
}


/* =====================================================
   SPLASH
===================================================== */

#splash{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    background:
    radial-gradient(
        circle at top,
        #383838,
        #111 65%
    );

}

.splash-content{

    width:90%;

    max-width:350px;

    animation:
    splashIn
    .9s
    ease;

}

.splash-logo{

    width:85px;

    height:85px;

    margin:auto;

    border-radius:26px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:34px;

    font-weight:bold;

    color:#111;

    background:
    linear-gradient(
        135deg,
        #d6b45c,
        #f3d77c
    );

    box-shadow:
    0 15px 40px
    rgba(214,180,92,.25);

}

.splash-content h1{

    margin-top:20px;

    font-size:32px;

    letter-spacing:4px;

}

.splash-content p{

    margin-top:8px;

    color:#aaa;

    font-size:14px;

}

.enter{

    margin-top:35px;

    width:100%;

    border:0;

    padding:15px;

    border-radius:14px;

    background:#d6b45c;

    color:#111;

    font-size:17px;

    font-weight:bold;

    transition:.25s;

}

.enter:active{

    transform:scale(.97);

}

@keyframes splashIn{

    from{

        opacity:0;

        transform:
        translateY(25px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:64px;

    background:#111;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
    0 16px;

    position:sticky;

    top:0;

    z-index:100;

}

.logo-small{

    display:flex;

    align-items:center;

    gap:9px;

    font-weight:bold;

    letter-spacing:2px;

}

.logo-icon{

    width:36px;

    height:36px;

    border-radius:11px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#d6b45c;

    color:#111;

}

.back{

    display:none;

    border:0;

    background:#292929;

    color:white;

    padding:
    9px 13px;

    border-radius:10px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:94%;

    max-width:1050px;

    margin:auto;

}


/* =====================================================
   HOME
===================================================== */

.home-title{

    text-align:center;

    margin-top:25px;

}

.home-title h1{

    font-size:25px;

}

.home-title p{

    color:#888;

    font-size:14px;

    margin-top:7px;

}


/* =====================================================
   CATEGORY CARDS
===================================================== */

.categories{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:14px;

    margin-top:25px;

}

.category{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.07);

    transition:.25s;

}

.category:active{

    transform:scale(.98);

}

.category-image{

    width:100%;

    height:145px;

    object-fit:cover;

}

.category-content{

    padding:12px;

}

.category-content h2{

    font-size:17px;

    margin-bottom:6px;

}

.rating{

    color:#d5ad48;

    font-size:14px;

    letter-spacing:1px;

}

.rating-number{

    color:#888;

    font-size:12px;

    margin-right:5px;

}


/* =====================================================
   DETAILS TOP CATEGORIES
===================================================== */

.details-categories{

    background:white;

    padding:
    12px 5px;

    position:sticky;

    top:64px;

    z-index:50;

    border-bottom:
    1px solid #eee;

}

.category-scroll{

    display:flex;

    gap:14px;

    overflow-x:auto;

    padding:
    2px 8px 5px;

    scrollbar-width:none;

}

.category-scroll::-webkit-scrollbar{

    display:none;

}

.circle-category{

    min-width:70px;

    text-align:center;

    cursor:pointer;

}

.circle-image{

    width:58px;

    height:58px;

    margin:auto;

    border-radius:50%;

    object-fit:cover;

    padding:2px;

    border:
    2px solid transparent;

}

.circle-category.active
.circle-image{

    border-color:#d5ad48;

    box-shadow:
    0 0 0 3px
    rgba(213,173,72,.15);

}

.circle-name{

    font-size:11px;

    margin-top:5px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.circle-category.active
.circle-name{

    color:#b08a2f;

    font-weight:bold;

}


/* =====================================================
   DETAIL CONTENT
===================================================== */

.details{

    padding-bottom:50px;

}

.hero{

    margin-top:18px;

    height:230px;

    border-radius:20px;

    overflow:hidden;

    position:relative;

}

.hero img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.hero-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:flex-end;

    padding:18px;

    color:white;

    background:
    linear-gradient(
        transparent 35%,
        rgba(0,0,0,.8)
    );

}

.hero-title{

    font-size:25px;

    font-weight:bold;

}

.hero-rating{

    margin-top:5px;

}


/* =====================================================
   INFO
===================================================== */

.info-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-top:15px;

}

.info{

    background:white;

    border-radius:15px;

    padding:14px;

    min-height:105px;

    box-shadow:
    0 4px 15px
    rgba(0,0,0,.04);

}

.info-icon{

    font-size:22px;

    margin-bottom:8px;

}

.info h3{

    font-size:14px;

    margin-bottom:5px;

}

.info p{

    color:#777;

    font-size:12px;

    line-height:1.5;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

    margin-top:25px;

    margin-bottom:12px;

    font-size:19px;

}


/* =====================================================
   PORTFOLIO
===================================================== */

.portfolio{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:7px;

}

.portfolio img{

    width:100%;

    height:115px;

    object-fit:cover;

    border-radius:12px;

    cursor:pointer;

}

.portfolio img:first-child{

    grid-column:
    span 2;

    height:150px;

}


/* =====================================================
   PRICE
===================================================== */

.price-card{

    background:#111;

    color:white;

    border-radius:17px;

    padding:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.price-label{

    color:#aaa;

    font-size:12px;

}

.price{

    color:#d6b45c;

    font-size:21px;

    font-weight:bold;

    margin-top:5px;

}


/* =====================================================
   DAYS
===================================================== */

.days{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

}

.day{

    padding:
    9px 13px;

    border-radius:20px;

    background:#eee;

    color:#888;

    font-size:12px;

}

.day.available{

    background:#f0e3bd;

    color:#8d6c1d;

    font-weight:bold;

}


/* =====================================================
   LOCATION
===================================================== */

.location{

    background:white;

    padding:15px;

    border-radius:16px;

}

.fake-map{

    height:180px;

    border-radius:14px;

    margin-top:10px;

    background:
    linear-gradient(
        135deg,
        #dbe8d9,
        #b9d0b7
    );

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    overflow:hidden;

}

.fake-map:before{

    content:"";

    position:absolute;

    width:150%;

    height:3px;

    background:white;

    transform:
    rotate(25deg);

    box-shadow:
    0 45px white,
    0 90px white,
    0 135px white;

}

.pin{

    position:relative;

    z-index:2;

    width:50px;

    height:50px;

    border-radius:50%;

    background:#d6b45c;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:22px;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.2);

}


/* =====================================================
   CONTACT
===================================================== */

.contact{

    background:white;

    padding:18px;

    border-radius:17px;

    margin-top:15px;

}

.contact p{

    color:#777;

    font-size:13px;

    line-height:1.8;

}

.contact-buttons{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:8px;

    margin-top:14px;

}

.contact-btn{

    padding:12px;

    border:0;

    border-radius:10px;

    font-weight:bold;

}

.call{

    background:#111;

    color:white;

}

.mail{

    background:#eee;

}


/* =====================================================
   LIGHTBOX
===================================================== */

#lightbox{

    display:none;

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.92);

    z-index:999;

    justify-content:center;

    align-items:center;

}

#lightbox img{

    max-width:92%;

    max-height:85%;

    border-radius:12px;

}

.close{

    position:absolute;

    top:18px;

    right:20px;

    color:white;

    font-size:35px;

    cursor:pointer;

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .categories{

        grid-template-columns:
        repeat(3,1fr);

    }

    .category-image{

        height:175px;

    }

    .info-grid{

        grid-template-columns:
        repeat(4,1fr);

    }

    .portfolio{

        grid-template-columns:
        repeat(5,1fr);

    }

    .portfolio img:first-child{

        grid-column:auto;

        height:150px;

    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:370px){

    .categories{

        gap:9px;

    }

    .category-image{

        height:120px;

    }

    .category-content h2{

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SPLASH
===================================================== -->

<div id="splash">

    <div class="splash-content">

        <div class="splash-logo">
            R
        </div>

        <h1>
            RÉSERVA
        </h1>

        <p>
            Découvrez • Choisissez • Réservez
        </p>

        <button
            class="enter"
            onclick="enterApp()"
        >
            Entrée
        </button>

    </div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo-small">

        <div class="logo-icon">
            R
        </div>

        RÉSERVA

    </div>


    <button
        id="backButton"
        class="back"
        onclick="showHome()"
    >
        ← رجوع
    </button>

</header>


<!-- =====================================================
     HOME
===================================================== -->

<section
    id="home"
    class="page"
>

    <div class="container">

        <div class="home-title">

            <h1>
                اكتشف الأقسام
            </h1>

            <p>
                اختر القسم الذي يناسبك
            </p>

        </div>


        <div
            id="categories"
            class="categories"
        ></div>

    </div>

</section>


<!-- =====================================================
     DETAILS
===================================================== -->

<section
    id="details"
    class="page"
>

    <!-- OTHER CATEGORIES -->

    <div
        class="details-categories"
    >

        <div
            id="categoryScroll"
            class="category-scroll"
        ></div>

    </div>


    <div
        id="detailsContent"
        class="container details"
    ></div>

</section>


<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    id="lightbox"
    onclick="closeLightbox()"
>

    <div class="close">
        ×
    </div>

    <img
        id="lightboxImage"
        src=""
    >

</div>


<script>


/* =====================================================
   DATA
===================================================== */

const places = [

    {

        id:"wedding",

        name:"قاعة الأعراس",

        title:"قاعة اللؤلؤة",

        rating:"★★★★★",

        score:"4.9",

        main:
        "https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1200&q=80",

        phone:"+213 550 00 00 00",

        email:"contact@perle.dz",

        address:"وهران، الجزائر",

        price:"120,000 دج",

        location:"وهران، الجزائر",

        days:[
            "السبت",
            "الخميس",
            "الجمعة"
        ],

        portfolio:[

            "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1478146896981-b80fe463b330?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1000&q=80"

        ]

    },


    {

        id:"sport",

        name:"قاعة الرياضة",

        title:"Fitness Arena",

        rating:"★★★★☆",

        score:"4.7",

        main:
        "https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=1200&q=80",

        phone:"+213 560 11 22 33",

        email:"contact@fitnessarena.dz",

        address:"وهران، الجزائر",

        price:"2,500 دج / شهر",

        location:"وهران، الجزائر",

        days:[
            "السبت",
            "الأحد",
            "الإثنين",
            "الثلاثاء",
            "الأربعاء",
            "الخميس"
        ],

        portfolio:[

            "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=1000&q=80",

            "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1000&q=80"

        ]

    }

];


/* =====================================================
   ENTER
===================================================== */

function enterApp(){

    document
    .getElementById("splash")
    .style.display="none";

    showHome();

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

    document
    .getElementById("home")
    .classList.add("active");

    document
    .getElementById("details")
    .classList.remove("active");

    document
    .getElementById("backButton")
    .style.display="none";

    window.scrollTo(0,0);

    renderCategories();

}


/* =====================================================
   RENDER HOME CATEGORIES
===================================================== */

function renderCategories(){

    const container=
    document.getElementById("categories");

    container.innerHTML="";

    places.forEach(place=>{

        container.innerHTML+=`

        <div
            class="category"
            onclick="
            openPlace('${place.id}')
            "
        >

            <img
                class="category-image"
                src="${place.main}"
            >

            <div class="category-content">

                <h2>
                    ${place.name}
                </h2>

                <div class="rating">

                    ${place.rating}

                    <span
                        class="rating-number"
                    >
                        ${place.score}
                    </span>

                </div>

            </div>

        </div>

        `;

    });

}


/* =====================================================
   OPEN PLACE
===================================================== */

function openPlace(id){

    const place=
    places.find(
        p=>p.id===id
    );

    if(!place) return;


    document
    .getElementById("home")
    .classList.remove("active");

    document
    .getElementById("details")
    .classList.add("active");

    document
    .getElementById("backButton")
    .style.display="block";


    renderTopCategories(id);

    renderDetails(place);

    window.scrollTo(0,0);

}


/* =====================================================
   TOP CATEGORIES
===================================================== */

function renderTopCategories(activeId){

    const container=
    document.getElementById(
        "categoryScroll"
    );

    container.innerHTML="";


    places.forEach(place=>{

        const active=
        place.id===activeId;


        container.innerHTML+=`

        <div
            class="circle-category
            ${active ? "active":""}"
            onclick="
            openPlace('${place.id}')
            "
        >

            <img
                class="circle-image"
                src="${place.main}"
            >

            <div class="circle-name">

                ${place.name}

            </div>

        </div>

        `;

    });

}


/* =====================================================
   DETAILS
===================================================== */

function renderDetails(place){

    const content=
    document.getElementById(
        "detailsContent"
    );


    let portfolio="";


    place.portfolio.forEach(image=>{

        portfolio+=`

        <img
            src="${image}"
            onclick="
            openLightbox('${image}')
            "
        >

        `;

    });


    const allDays=[

        "السبت",
        "الأحد",
        "الإثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة"

    ];


    let days="";


    allDays.forEach(day=>{

        const available=
        place.days.includes(day);

        days+=`

        <div
            class="day
            ${available ? "available":""}"
        >

            ${day}

            ${available ? " ✓":""}

        </div>

        `;

    });


    content.innerHTML=`

        <!-- HERO -->

        <div class="hero">

            <img
                src="${place.main}"
            >

            <div
                class="hero-overlay"
            >

                <div>

                    <div
                        class="hero-title"
                    >
                        ${place.title}
                    </div>

                    <div
                        class="hero-rating"
                    >

                        <span
                            class="rating"
                        >
                            ${place.rating}
                        </span>

                        ${place.score}

                    </div>

                </div>

            </div>

        </div>


        <!-- INFO -->

        <div class="info-grid">


            <div class="info">

                <div class="info-icon">
                    📍
                </div>

                <h3>
                    العنوان
                </h3>

                <p>
                    ${place.address}
                </p>

            </div>


            <div class="info">

                <div class="info-icon">
                    📞
                </div>

                <h3>
                    الهاتف
                </h3>

                <p>
                    ${place.phone}
                </p>

            </div>


            <div class="info">

                <div class="info-icon">
                    ✉️
                </div>

                <h3>
                    البريد الإلكتروني
                </h3>

                <p>
                    ${place.email}
                </p>

            </div>


            <div class="info">

                <div class="info-icon">
                    ⭐
                </div>

                <h3>
                    التقييم
                </h3>

                <p>
                    ${place.score} / 5
                </p>

            </div>

        </div>


        <!-- PORTFOLIO -->

        <h2 class="section-title">
            📸 الصور
        </h2>

        <div class="portfolio">

            ${portfolio}

        </div>


        <!-- PRICE -->

        <h2 class="section-title">
            💰 السعر
        </h2>

        <div class="price-card">

            <div>

                <div
                    class="price-label"
                >
                    السعر يبدأ من
                </div>

                <div class="price">
                    ${place.price}
                </div>

            </div>

            <div>
                💳
            </div>

        </div>


        <!-- DAYS -->

        <h2 class="section-title">
            📅 الأيام المتاحة
        </h2>

        <div class="info">

            <div class="days">

                ${days}

            </div>

        </div>


        <!-- LOCATION -->

        <h2 class="section-title">
            📍 الموقع
        </h2>

        <div class="location">

            <strong>
                ${place.location}
            </strong>

            <div class="fake-map">

                <div class="pin">
                    📍
                </div>

            </div>

        </div>


        <!-- CONTACT -->

        <div class="contact">

            <h2>
                تواصل مع صاحب القسم
            </h2>

            <p>

                📞 ${place.phone}

                <br>

                ✉️ ${place.email}

            </p>


            <div
                class="contact-buttons"
            >

                <button
                    class="contact-btn call"
                    onclick="
                    callPlace('${place.phone}')
                    "
                >
                    📞 اتصال
                </button>


                <button
                    class="contact-btn mail"
                    onclick="
                    emailPlace('${place.email}')
                    "
                >
                    ✉️ البريد
                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   CALL
===================================================== */

function callPlace(phone){

    window.location.href=
    "tel:"+phone;

}


/* =====================================================
   EMAIL
===================================================== */

function emailPlace(email){

    window.location.href=
    "mailto:"+email;
