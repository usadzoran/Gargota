<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>jour j</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f7f5f0;
    color:#222;
    font-family:Arial,Tahoma,sans-serif;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

img{
    display:block;
}

.page{
    display:none;
}

.page.active{
    display:block;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:64px;

    background:#171717;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;

    position:sticky;

    top:0;

    z-index:100;

}

.logo-small{

    display:flex;

    align-items:center;

    gap:9px;

    font-family:Georgia,serif;

    font-size:21px;

    letter-spacing:3px;

}

.logo-icon{

    width:36px;
    height:36px;

    border-radius:11px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#d3ad58;

    color:#111;

    font-weight:bold;

}

.header-btn{

    border:none;

    background:#2b2b2b;

    color:white;

    padding:9px 14px;

    border-radius:10px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:94%;

    max-width:1050px;

    margin:auto;

}


/* =====================================================
   HOME
===================================================== */

.home-header{

    text-align:center;

    padding-top:30px;

}

.home-header h1{

    font-family:Georgia,serif;

    font-size:27px;

}

.home-header p{

    color:#888;

    font-size:14px;

    margin-top:8px;

}

.categories{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:14px;

    margin-top:25px;

    padding-bottom:40px;

}

.category-card{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
    0 5px 20px rgba(0,0,0,.07);

    cursor:pointer;

    transition:.25s;

}

.category-card:hover{

    transform:translateY(-4px);

}

.category-image{

    width:100%;

    height:160px;

    object-fit:cover;

}

.category-content{

    padding:13px;

}

.category-content h2{

    font-size:17px;

    margin-bottom:6px;

}

.rating{

    color:#d1a642;

    letter-spacing:1px;

}

.rating-score{

    color:#888;

    font-size:12px;

    margin-right:5px;

}


/* =====================================================
   DETAILS
===================================================== */

.details-container{

    padding-bottom:50px;

}

.hero{

    height:235px;

    margin-top:18px;

    border-radius:20px;

    overflow:hidden;

    position:relative;

}

.hero img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.hero-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:flex-end;

    padding:20px;

    color:white;

    background:
    linear-gradient(
        transparent 30%,
        rgba(0,0,0,.82)
    );

}

.hero-title{

    font-size:27px;

    font-weight:bold;

}

.hero-rating{

    margin-top:6px;

}


/* =====================================================
   INFO
===================================================== */

.info-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-top:15px;

}

.info-card{

    background:white;

    min-height:105px;

    padding:14px;

    border-radius:15px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.04);

}

.info-icon{

    font-size:21px;

    margin-bottom:8px;

}

.info-card h3{

    font-size:14px;

    margin-bottom:5px;

}

.info-card p{

    color:#777;

    font-size:12px;

    line-height:1.6;

}


/* =====================================================
   SECTIONS
===================================================== */

.section-title{

    margin-top:27px;

    margin-bottom:12px;

    font-size:19px;

    font-family:Georgia,serif;

}


/* =====================================================
   PORTFOLIO
===================================================== */

.portfolio{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:7px;

}

.portfolio img{

    width:100%;

    height:110px;

    object-fit:cover;

    border-radius:12px;

    cursor:pointer;

}

.portfolio img:first-child{

    grid-column:span 2;

    height:145px;

}


/* =====================================================
   PRICE
===================================================== */

.price-card{

    background:#171717;

    color:white;

    padding:19px;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.price-label{

    color:#aaa;

    font-size:12px;

}

.price{

    color:#d7b45c;

    font-size:22px;

    font-weight:bold;

    margin-top:5px;

}


/* =====================================================
   DAYS
===================================================== */

.days-card{

    background:white;

    border-radius:16px;

    padding:15px;

}

.days{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

}

.day{

    padding:9px 13px;

    border-radius:20px;

    background:#eee;

    color:#888;

    font-size:12px;

}

.day.available{

    background:#f1e3bd;

    color:#89691e;

    font-weight:bold;

}


/* =====================================================
   CONTACT
===================================================== */

.contact-card{

    background:white;

    border-radius:17px;

    padding:18px;

    margin-top:16px;

}

.contact-info{

    color:#777;

    font-size:13px;

    line-height:1.9;

    margin-top:7px;

}


/* =====================================================
   ADMIN
===================================================== */

.admin-page{

    padding:
    25px 0 60px;

}

.admin-title{

    text-align:center;

    margin-bottom:20px;

}

.admin-title h1{

    font-family:Georgia,serif;

    font-size:27px;

}

.admin-title p{

    color:#888;

    font-size:13px;

    margin-top:7px;

}

.admin-card{

    background:white;

    border-radius:18px;

    padding:18px;

    margin-bottom:15px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.05);

}

.admin-card h2{

    font-size:17px;

    margin-bottom:15px;

}

.form-group{

    margin-bottom:13px;

}

.form-group label{

    display:block;

    font-size:13px;

    font-weight:bold;

    margin-bottom:6px;

}

.form-group input,
.form-group textarea{

    width:100%;

    border:1px solid #ddd;

    background:#fafafa;

    border-radius:11px;

    padding:12px;

    outline:none;

    font-size:14px;

}

.form-group textarea{

    min-height:90px;

    resize:vertical;

}

.form-group input:focus,
.form-group textarea:focus{

    border-color:#c89b3c;

    background:white;

}


/* =====================================================
   DAYS ADMIN
===================================================== */

.days-selector{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

}

.day-check{

    position:relative;

}

.day-check input{

    display:none;

}

.day-check label{

    display:block;

    padding:9px 13px;

    background:#eee;

    color:#777;

    border-radius:20px;

    font-size:12px;

    cursor:pointer;

}

.day-check input:checked + label{

    background:#f1e3bd;

    color:#89691e;

    font-weight:bold;

}


/* =====================================================
   IMAGE INPUTS
===================================================== */

.image-input{

    display:flex;

    gap:8px;

    margin-bottom:8px;

}

.image-input input{

    flex:1;

}

.remove-image{

    border:none;

    background:#eee;

    color:#a33;

    width:42px;

    border-radius:10px;

}


/* =====================================================
   ADMIN BUTTONS
===================================================== */

.admin-buttons{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;

    margin-top:15px;

}

.save-btn{

    border:none;

    background:#171717;

    color:white;

    padding:14px;

    border-radius:12px;

    font-weight:bold;

}

.preview-btn{

    border:none;

    background:#d4ad54;

    color:#111;

    padding:14px;

    border-radius:12px;

    font-weight:bold;

}

.reset-btn{

    width:100%;

    border:none;

    background:#eee;

    color:#a33;

    padding:12px;

    border-radius:11px;

    margin-top:10px;

}


/* =====================================================
   LOGIN
===================================================== */

.login-page{

    min-height:
    calc(100vh - 64px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.login-card{

    width:100%;

    max-width:400px;

    background:white;

    padding:25px;

    border-radius:20px;

    box-shadow:
    0 10px 35px rgba(0,0,0,.08);

}

.login-card h1{

    text-align:center;

    font-family:Georgia,serif;

    margin-bottom:7px;

}

.login-card p{

    text-align:center;

    color:#888;

    font-size:13px;

    margin-bottom:22px;

}

.login-btn{

    width:100%;

    border:none;

    background:#171717;

    color:white;

    padding:14px;

    border-radius:12px;

    font-weight:bold;

}

.demo-note{

    background:#f7f1df;

    color:#85651d;

    padding:11px;

    border-radius:10px;

    font-size:12px;

    margin-bottom:15px;

    text-align:center;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    padding:30px 10px;

    color:#999;

    font-size:12px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(min-width:700px){

    .categories{

        grid-template-columns:
        repeat(3,1fr);

    }

    .info-grid{

        grid-template-columns:
        repeat(4,1fr);

    }

    .portfolio{

        grid-template-columns:
        repeat(5,1fr);

    }

    .portfolio img{

        height:145px;

    }

    .portfolio img:first-child{

        grid-column:auto;

        height:145px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo-small">

        <div class="logo-icon">
            J
        </div>

        jour j

    </div>


    <button
        id="headerButton"
        class="header-btn"
        onclick="openOwnerLogin()"
    >
        👤 صاحب القسم
    </button>

</header>


<!-- =====================================================
     HOME
===================================================== -->

<section
    id="homePage"
    class="page active"
>

    <div class="container">

        <div class="home-header">

            <h1>
                اكتشف الأقسام
            </h1>

            <p>
                اختر المكان المناسب ليومك المميز
            </p>

        </div>


        <div
            id="categories"
            class="categories"
        ></div>


        <div class="footer">
            jour j © 2026
        </div>

    </div>

</section>


<!-- =====================================================
     DETAILS
===================================================== -->

<section
    id="detailsPage"
    class="page"
>

    <div
        id="detailsContent"
        class="container details-container"
    ></div>

</section>


<!-- =====================================================
     LOGIN
===================================================== -->

<section
    id="loginPage"
    class="page"
>

    <div class="login-page">

        <div class="login-card">

            <h1>
                دخول صاحب القسم
            </h1>

            <p>
                إدارة معلومات قسمك
            </p>


            <div class="demo-note">

                نسخة تجريبية

                <br>

                كلمة المرور:
                <strong>1234</strong>

            </div>


            <div class="form-group">

                <label>
                    كلمة المرور
                </label>

                <input
                    id="ownerPassword"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                >

            </div>


            <button
                class="login-btn"
                onclick="ownerLogin()"
            >

                دخول لوحة التحكم

            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     ADMIN
===================================================== -->

<section
    id="adminPage"
    class="page"
>

    <div class="container admin-page">


        <div class="admin-title">

            <h1>
                لوحة صاحب القسم
            </h1>

            <p>
                قاعة الأعراس — تعديل المعلومات
            </p>

        </div>


        <!-- BASIC INFORMATION -->

        <div class="admin-card">

            <h2>
                📝 المعلومات الأساسية
            </h2>


            <div class="form-group">

                <label>
                    اسم القسم
                </label>

                <input
                    id="adminName"
                    type="text"
                >

            </div>


            <div class="form-group">

                <label>
                    اسم المكان
                </label>

                <input
                    id="adminTitle"
                    type="text"
                >

            </div>


            <div class="form-group">

                <label>
                    رقم الهاتف
                </label>

                <input
                    id="adminPhone"
                    type="text"
                >

            </div>


            <div class="form-group">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    id="adminEmail"
                    type="email"
                >

            </div>


            <div class="form-group">

                <label>
                    العنوان
                </label>

                <input
                    id="adminAddress"
                    type="text"
                >

            </div>


            <div class="form-group">

                <label>
                    السعر
                </label>

                <input
                    id="adminPrice"
                    type="text"
                >

            </div>


            <div class="form-group">

                <label>
                    التقييم
                </label>

                <input
                    id="adminScore"
                    type="number"
                    min="0"
                    max="5"
                    step="0.1"
                >

            </div>

        </div>


        <!-- MAIN IMAGE -->

        <div class="admin-card">

            <h2>
                🖼️ الصورة الرئيسية
            </h2>

            <div class="form-group">

                <label>
                    رابط الصورة
                </label>

                <input
                    id="adminMainImage"
                    type="url"
                    placeholder="https://..."
                >

            </div>

        </div>


        <!-- DAYS -->

        <div class="admin-card">

            <h2>
                📅 الأيام المتاحة
            </h2>


            <div
                id="daysSelector"
                class="days-selector"
            >

            </div>

        </div>


        <!-- PORTFOLIO -->

        <div class="admin-card">

            <h2>
                📸 معرض الصور
            </h2>


            <div
                id="portfolioInputs"
            ></div>


            <button
                class="preview-btn"
                onclick="addPortfolioInput()"
                style="width:100%;margin-top:8px;"
            >

                ＋ إضافة صورة

            </button>

        </div>


        <!-- ACTIONS -->

        <div class="admin-card">

            <div class="admin-buttons">

                <button
                    class="save-btn"
                    onclick="saveOwnerData()"
                >

                    💾 حفظ التغييرات

                </button>


                <button
                    class="preview-btn"
                    onclick="previewOwnerData()"
                >

                    👁️ معاينة

                </button>

            </div>


            <button
                class="reset-btn"
                onclick="resetOwnerData()"
            >

                إعادة البيانات الأصلية

            </button>

        </div>


        <div class="footer">

            jour j © 2026

        </div>


    </div>

</section>


<script>

/* =====================================================
   ORIGINAL DATA
===================================================== */

const defaultPlace = {

    id:"wedding",

    name:"قاعة الأعراس",

    title:"قاعة اللؤلؤة",

    rating:"★★★★★",

    score:"4.9",

    mainImage:
    "https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1400&q=85",

    phone:
    "+213 550 00 00 00",

    email:
    "contact@perle.dz",

    address:
    "وهران، الجزائر",

    price:
    "120,000 دج",

    location:
    "وهران، الجزائر",

    days:[
        "السبت",
        "الخميس",
        "الجمعة"
    ],

    portfolio:[

        "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=85",

        "https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=1200&q=85",

        "https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1200&q=85",

        "https://images.unsplash.com/photo-1478146896981-b80fe463b330?auto=format&fit=crop&w=1200&q=85",

        "https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1200&q=85"

    ]

};


/* =====================================================
   LOAD DATA
===================================================== */

function getPlace(){

    const saved =
    localStorage.getItem(
        "jourJ_wedding"
    );

    if(saved){

        try{

            return JSON.parse(saved);

        }catch(error){

            return {...defaultPlace};

        }

    }

    return {...defaultPlace};

}


/* =====================================================
   SAVE DATA
===================================================== */

function saveData(place){

    localStorage.setItem(
        "jourJ_wedding",
        JSON.stringify(place)
    );

}


/* =====================================================
   HOME
===================================================== */

function showPage(pageId){

    document
    .querySelectorAll(".page")
    .forEach(page=>{

        page.classList.remove("active");

    });


    document
    .getElementById(pageId)
    .classList.add("active");


    window.scrollTo(0,0);

}


/* =====================================================
   RENDER HOME
===================================================== */

function renderHome(){

    const place =
    getPlace();


    const container =
    document.getElementById(
        "categories"
    );


    container.innerHTML = `

        <div
            class="category-card"
            onclick="openDetails()"
        >

            <img
                class="category-image"
                src="${place.mainImage}"
                alt="${place.name}"
            >

            <div class="category-content">

                <h2>
                    ${place.name}
                </h2>

                <div class="rating">

                    ${place.rating}

                    <span class="rating-score">

                        ${place.score}

                    </span>

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   DETAILS
===================================================== */

function openDetails(){

    const place =
    getPlace();


    let portfolioHTML="";


    place.portfolio.forEach(image=>{

        portfolioHTML += `

            <img
                src="${image}"
                alt="صورة من معرض ${place.name}"
                onclick="openImage('${image}')"
            >

        `;

    });


    const allDays=[

        "السبت",
        "الأحد",
        "الإثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة"

    ];


    let daysHTML="";


    allDays.forEach(day=>{

        const available =
        place.days.includes(day);


        daysHTML += `

            <div
                class="
                    day
                    ${available ? "available" : ""}
                "
            >

                ${day}

                ${available ? " ✓" : ""}

            </div>

        `;

    });


    document
    .getElementById(
        "detailsContent"
    )
    .innerHTML = `

        <div class="hero">

            <img
                src="${place.mainImage}"
                alt="${place.title}"
            >

            <div class="hero-overlay">

                <div>

                    <div class="hero-title">

                        ${place.title}

                    </div>

                    <div class="hero-rating">

                        <span class="rating">

                            ${place.rating}

                        </span>

                        <span>

                            ${place.score} / 5

                        </span>

                    </div>

                </div>

            </div>

        </div>


        <div class="info-grid">


            <div class="info-card">

                <div class="info-icon">
                    📍
                </div>

                <h3>
                    العنوان
                </h3>

                <p>
                    ${place.address}
                </p>

            </div>


            <div class="info-card">

                <div class="info-icon">
                    📞
                </div>

                <h3>
                    الهاتف
                </h3>

                <p>
                    ${place.phone}
                </p>

            </div>


            <div class="info-card">

                <div class="info-icon">
                    ✉️
                </div>

                <h3>
                    البريد
                </h3>

                <p>
                    ${place.email}
                </p>

            </div>


            <div class="info-card">

                <div class="info-icon">
                    ⭐
                </div>

                <h3>
                    التقييم
                </h3>

                <p>
                    ${place.score} / 5
                </p>

            </div>


        </div>


        <h2 class="section-title">

            📸 معرض الصور

        </h2>


        <div class="portfolio">

            ${portfolioHTML}

        </div>


        <h2 class="section-title">

            💰 السعر

        </h2>


        <div class="price-card">

            <div>

                <div class="price-label">

                    السعر يبدأ من

                </div>

                <div class="price">

                    ${place.price}

                </div>

            </div>

            <div>

                💳

            </div>

        </div>


        <h2 class="section-title">

            📅 الأيام المتاحة

        </h2>


        <div class="days-card">

            <div class="days">

                ${daysHTML}

            </div>

        </div>


        <div class="contact-card">

            <h2>

                تواصل مع صاحب القسم

            </h2>


            <div class="contact-info">

                📞 ${place.phone}

                <br>

                ✉️ ${place.email}

            </div>

        </div>


        <div class="footer">

            <button
                class="header-btn"
                onclick="showPage('homePage')"
            >

                ← العودة

            </button>

            <br><br>

            jour j © 2026

        </div>

    `;


    showPage("detailsPage");

}


/* =====================================================
   LOGIN
===================================================== */

/* =====================================================

===================================================== */

function ownerLogin(){

    document.getElementById(
        "ownerPassword"
    ).value;


    if(password !== "1234"){

        alert(
            "كلمة المرور غير صحيحة"
        );

        return;

    }


    loadAdminData();

    showPage("adminPage");

/* =====================================================
   LOAD ADMIN DATA
===================================================== */

function loadAdminData(){

    const place =
    getPlace();


    document
    .getElementById("adminName")
    .value=place.name;


    document
    .getElementById("adminTitle")
    .value=place.title;


    document
    .getElementById("adminPhone")
    .value=place.phone;


    document
    .getElementById("adminEmail")
    .value=place.email;


    document
    .getElementById("adminAddress")
    .value=place.address;


    document
    .getElementById("adminPrice")
    .value=place.price;


    document
    .getElementById("adminScore")
    .value=place.score;


    document
    .getElementById("adminMainImage")
    .value=place.mainImage;


    renderDaysSelector(place.days);

    renderPortfolioInputs(place.portfolio);

}


/* =====================================================
   DAYS SELECTOR
===================================================== */

function renderDaysSelector(selectedDays){

    const days=[

        "السبت",
        "الأحد",
        "الإثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة"

    ];


    const container =
    document.getElementById(
        "daysSelector"
    );


    container.innerHTML="";


    days.forEach((day,index)=>{

        const checked =
        selectedDays.includes(day)
        ? "checked"
        : "";


        container.innerHTML += `

            <div class="day-check">

                <input
                    type="checkbox"
                    id="day${index}"
                    value="${day}"
                    ${checked}
                >

                <label for="day${index}">

                    ${day}

                </label>

            </div>

        `;

    });

}


/* =====================================================
   PORTFOLIO INPUTS
===================================================== */

function renderPortfolioInputs(images){

    const container =
    document.getElementById(
        "portfolioInputs"
    );


    container.innerHTML="";


    images.forEach(image=>{

        addPortfolioInput(image);

    });

}


function addPortfolioInput(value=""){

    const container =
    document.getElementById(
        "portfolioInputs"
    );


    const div =
    document.createElement("div");


    div.className="image-input";


    div.innerHTML = `

        <input
            type="url"
            value="${value}"
            placeholder="رابط صورة https://..."
        >

        <button
            class="remove-image"
            onclick="this.parentElement.remove()"
        >

            ×

        </button>

    `;


    container.appendChild(div);

}


/* =====================================================
   GET SELECTED DAYS
===================================================== */

function getSelectedDays(){

    const checked =
    document.querySelectorAll(
        "#daysSelector input:checked"
    );


    return Array
    .from(checked)
    .map(input=>input.value);

}


/* =====================================================
   SAVE OWNER DATA
===================================================== */

function saveOwnerData(){

    const oldPlace =
    getPlace();


    const portfolioInputs =
    document.querySelectorAll(
        "#portfolioInputs input"
    );


    const portfolio =
    Array
    .from(portfolioInputs)
    .map(input=>input.value.trim())
    .filter(value=>value !== "");


    const score =
    parseFloat(
        document.getElementById(
            "adminScore"
        ).value
    ) || 0;


    const newPlace={

        ...oldPlace,

        name:
        document.getElementById(
            "adminName"
        ).value.trim(),

        title:
        document.getElementById(
            "adminTitle"
        ).value.trim(),

        phone:
        document.getElementById(
            "adminPhone"
        ).value.trim(),

        email:
        document.getElementById(
            "adminEmail"
        ).value.trim(),

        address:
        document.getElementById(
            "adminAddress"
        ).value.trim(),

        price:
        document.getElementById(
            "adminPrice"
        ).value.trim(),

        score:score.toFixed(1),

        rating:
        generateStars(score),

        mainImage:
        document.getElementById(
            "adminMainImage"
        ).value.trim(),

        days:
        getSelectedDays(),

        portfolio:
        portfolio

    };


    saveData(newPlace);


    renderHome();


    alert(
        "تم حفظ المعلومات بنجاح ✅"
    );

}


/* =====================================================
   GENERATE STARS
===================================================== */

function generateStars(score){

    const rounded =
    Math.round(score);


    return "★".repeat(
        rounded
    )
    +
    "☆".repeat(
        5-rounded
    );

}


/* =====================================================
   PREVIEW
===================================================== */

function previewOwnerData(){

    saveOwnerData();

    openDetails();

}


/* =====================================================
   RESET

function resetOwnerData(){

    const confirmReset =
    confirm(
        "هل تريد إعادة المعلومات الأصلية؟"
    );


    if(!confirmReset) return;


    localStorage.removeItem(
        "jourJ_wedding"
    );


    loadAdminData();

    renderHome();


    alert(
        "تمت إعادة البيانات الأصلية"
    );

}
